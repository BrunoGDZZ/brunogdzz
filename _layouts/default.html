<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ page.title }}</title>

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/game/game.css' | relative_url }}" />
    <script src="{{ '/script.js' | relative_url }}" defer></script>
</head>

<body>
    <header class="site-header">
        <nav class="nav">
            <span class="logo">Bruno De Souza</span>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Bruno Garbuio De Souza</p>
    </footer>
<button id="bruno-game-launcher" type="button" aria-label="Open mini game">🎸 Play?</button>

    <div id="bruno-game-modal" role="dialog" aria-modal="true" aria-label="Bruno's guitar game">
        <div class="bruno-game-box">
            <div class="bruno-game-head">
                <div><strong>🎸 Bruno's Tiny Guitar Game</strong><div class="bruno-game-stats" id="bruno-score">Score: 0 • Best: 0</div></div>
                <div><span id="bruno-combo">Combo: 0x</span> · <span id="bruno-time">Time: 30s</span> <button class="bruno-game-close" id="bruno-game-close" type="button" aria-label="Close">×</button></div>
            </div>
            <canvas id="bruno-guitar-game" width="648" height="363"></canvas>
            <div class="bruno-game-help">Hit notes with <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> — or tap a lane.</div>
            <div class="bruno-game-buttons"><button id="bruno-restart" type="button">Restart</button></div>
        </div>
    </div>
    <script src="{{ '/assets/game/game.js' | relative_url }}" defer></script>
</body>
</html>
